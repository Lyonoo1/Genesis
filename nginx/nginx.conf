map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream web_backend {
    server web:3000;
    keepalive 32;
}

upstream api_backend {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name petpalapp.cn www.petpalapp.cn 124.221.147.57 _;

    client_max_body_size 50M;

    # Gzip 压缩加速
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 1. 终端与 Bridge WebSocket 代理 (同时兼容 /genesis/api 与 /api 前缀)
    location ~* ^/(genesis/)?api/(terminal/ws|bridge/ws) {
        rewrite ^/genesis/(.*) /$1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 长连接保持 (避免终端会话因超时中断)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. FastAPI 后端接口与 SSE 流式响应 (同时兼容 /genesis/api 与 /api 前缀)
    location ~* ^/(genesis/)?api/ {
        rewrite ^/genesis/(.*) /$1 break;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 核心：必须禁用缓冲区，保证 Agent SSE 打字机流式输出流畅无卡顿
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Agent 复杂思考与 Tool Calling 较长耗时保护 (1小时)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 3. Next.js 前端应用 (托管于 /genesis 二级路径，兼容末尾斜杠与无斜杠，消除 301/308 重定向死循环)
    location ^~ /genesis {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 根路由访问自动跳转到 /genesis
    location = / {
        return 301 /genesis;
    }

    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
